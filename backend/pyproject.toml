[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exp07-slr-engine"
version = "0.7.0"
description = "EXP-07 Selective Layer Residency (SLR) Inference Engine and API"
authors = [{ name = "Selective Layer Residency Research Team" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "safetensors>=0.4.3",
    "tokenizers>=0.19.0",
    "psutil>=5.9.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
